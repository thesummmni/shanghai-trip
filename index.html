/* VOICE: 필름으로 찍은 상하이 — 흐린 날의 와이탄, 비 오는 밤의 금빛 조명. 차분하고 에디토리얼하게
   IDEA: 여행 매거진의 한 꼭지 · 사진 캡션 같은 영문 라벨과 큰 세리프 제목
   PICTURE: 첫 화면의 와이탄 야경 일러스트(금빛 석조 건물, 시계탑, 안개 속 동방명주, 젖은 바닥 반사) + 핀 지도
   COLOUR and TYPE: 낮=안개 회백 #ecebe6 · 밤=먹빛 #12110f, 벽돌 #a9533c, 금빛 #d6a54a / Cormorant Garamond + 나눔명조 제목, Noto Sans KR 본문

:root{color-scheme:dark;--bg:light-dark(#ecebe6,#12110f);--paper:light-dark(#f7f6f2,#1c1a17);--ink:light-dark(#1f1d1b,#efe7d8);--mute:light-dark(#77726b,#a39a8a);--line:light-dark(#d9d6ce,#34302a);--river:light-dark(#d3d9d8,#262c2c);--tape:light-dark(rgba(169,83,60,.16),rgba(214,165,74,.18));--c:#a9533c;--soft:light-dark(#e9e3da,#2a2620);--gold:light-dark(#a87a2a,#e0b25c);--sky1:light-dark(#d9dad6,#0d0f14);--sky2:light-dark(#eeeeea,#2a2418);--bld:light-dark(#c9c3b8,#3a2d18);--win:light-dark(#efe9dc,#ffcf6e);--brick:light-dark(#a95d45,#4d2b1d);--glow:light-dark(rgba(255,255,255,0),rgba(255,190,90,.55))}

.sec{margin-top:26px}
.sec h2{display:flex;align-items:baseline;gap:0 10px;flex-wrap:wrap}
.sec h2 .hand{font-size:22px}
.cl{background:var(--paper);border-radius:14px;box-shadow:0 1px 0 var(--line),0 8px 20px -16px rgba(60,40,30,.5);overflow:hidden}
.ci{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px;gap:8px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.ci:first-child{border-top:0}
.ci.head{font-size:13px;color:var(--mute);padding:8px 14px;background:var(--soft)}
.ci.head span{text-align:center}
.ci .t{font-weight:500}
.ci .d{font-size:14px;color:var(--mute);margin-top:2px}
.ci .d a{color:inherit}
.ci.urgent .t::before{content:"꼭! ";color:light-dark(#a8443a,#ff9d90);font-weight:700}
.ck{justify-self:center;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center;font-size:20px;color:#fff}
.ck[aria-pressed=true]{background:var(--c);border-color:var(--c)}
.ck.k2[aria-pressed=true]{background:#a07a2c;border-color:#a07a2c}
.ci.done .t{text-decoration:line-through;text-decoration-color:var(--mute);color:var(--mute)}
.ci .x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:13px;padding:4px 0;text-decoration:underline}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.addrow input{flex:1;min-width:180px;font:inherit;font-size:16px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
@media(max-width:600px){.ci{grid-template-columns:minmax(0,1fr) 48px 48px;padding:12px 10px}.ck{width:44px;height:44px}.leg{margin-left:20px}.stop{grid-template-columns:52px minmax(0,1fr)}.time{font-size:17px}}
.modal{position:fixed;inset:0;background:rgba(30,20,15,.4);display:none;align-items:flex-end;justify-content:center;z-index:9;padding:10px}
.modal.on{display:flex}
@media(min-width:600px){.modal{align-items:center}}
.sheet{background:var(--paper);color:var(--ink);border-radius:20px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}
.sheet label{display:block;font-size:14px;font-weight:500;margin:10px 0 4px}
.sheet input,.sheet select,.sheet textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;max-width:92vw;text-align:center}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

const toT=m=>{m=Math.round(m);const h=Math.floor(m/60)%24,mm=((m%60)+60)%60;return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0')};

 let pp=day.start;
 for(let i=1;i<seq.length;i++){const s=seq[i];const from=(pp.lng==null)?prev:pp;const d=km(from,s);const tr=travel(d);if(d)totKm+=d;

 let best=free.slice(),bc=cost(best);
 if(free.length<=8){const perm=(a,n)=>{if(n===1){const c=cost(a);if(c<bc){bc=c;best=a.slice()}return}for(let i=0;i<n;i++){perm(a,n-1);const j=n%2?0:i;[a[j],a[n-1]]=[a[n-1],a[j]]}};perm(free.slice(),free.length)}
 else{let imp=true;while(imp){imp=false;for(let i=0;i<best.length-1;i++)for(let j=i+1;j<best.length;j++){const c=best.slice(0,i).concat(best.slice(i,j+1).reverse(),best.slice(j+1));const cc=cost(c);if(cc<bc-1e-6){best=c;bc=cc;imp=true}}}}
 const before=cost(free);snap();slots.forEach((p,k)=>st[p]=best[k]);save();render();

function gcj2wgs(lng,lat){const a=6378245,ee=0.00669342162296594323;const tl=(x,y)=>{let r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;return r};
 const tg=(x,y)=>{let r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;return r};
 let dLat=tl(lng-105,lat-35),dLng=tg(lng-105,lat-35);const rl=lat/180*Math.PI;let m=Math.sin(rl);m=1-ee*m*m;const sm=Math.sqrt(m);
 dLat=dLat*180/((a*(1-ee))/(m*sm)*Math.PI);dLng=dLng*180/(a/sm*Math.cos(rl)*Math.PI);return[lng-dLng,lat-dLat]}

 // 격자 (1km)
 const step=0.0105;for(let l=Math.floor((view.cx-view.span)/step)*step;l<view.cx+view.span;l+=step){const x=X(l);if(x>0&&x<W)g+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--line)" stroke-width="0.5" stroke-dasharray="1 5"/>`}
 for(let a=Math.floor((view.cy-view.span)/(step/ky))*(step/ky);a<view.cy+view.span;a+=step/ky){const y=Y(a);if(y>0&&y<H)g+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--line)" stroke-width="0.5" stroke-dasharray="1 5"/>`}
 g+=`<polyline points="${RIVER.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" fill="none" stroke="var(--river)" stroke-width="${Math.max(8,0.0045*sc)}" stroke-linecap="round" stroke-linejoin="round"/>`;
 const line=pts.map(p=>X(p.lng)+','+Y(p.lat)).join(' ');
 g+=`<polyline points="${line}" fill="none" stroke="${c}" stroke-width="3" stroke-dasharray="7 5" stroke-linejoin="round" opacity=".85"/>`;
 // 구간 거리
 P.rows.forEach(r=>{if(!r.d||r.d<0.05||r.from.lng==null||r.s.lng==null)return;const mx=(X(r.from.lng)+X(r.s.lng))/2,my=(Y(r.from.lat)+Y(r.s.lat))/2;const t=fkm(r.d);const w=t.length*7+10;
  g+=`<rect x="${mx-w/2}" y="${my-10}" width="${w}" height="20" rx="10" fill="var(--paper)" stroke="${c}" stroke-width="1"/><text x="${mx}" y="${my+4}" text-anchor="middle" font-size="12" fill="var(--ink)">${t}</text>`});
 // 핀 (같은 위치는 겹치지 않게 살짝 옆으로)
 const seen={};P.rows.forEach((r,i)=>{const s=r.s;if(s.lng==null)return;const k=s.lng.toFixed(4)+s.lat.toFixed(4);const o=(seen[k]=(seen[k]||0)+1)-1;
  const x=X(s.lng)+o*22,y=Y(s.lat);const lab=r.anchor==='start'?'출':r.anchor==='end'?'도':String(i);const fill=r.anchor?'var(--ink)':c;
  g+=`<g><ellipse cx="${x}" cy="${y+2}" rx="7" ry="3" fill="#000" opacity=".18"/><path d="M${x} ${y} C${x-4} ${y-10} ${x-13} ${y-14} ${x-13} ${y-24} A13 13 0 1 1 ${x+13} ${y-24} C${x+13} ${y-14} ${x+4} ${y-10} ${x} ${y}Z" fill="${fill}" stroke="var(--paper)" stroke-width="2"/><text x="${x}" y="${y-20}" text-anchor="middle" font-size="12" font-weight="700" fill="${r.anchor?'var(--bg)':'#fff'}">${lab}</text>
  ${o===0?`<text x="${x+16}" y="${y-28}" font-size="12" font-weight="500" fill="var(--ink)" stroke="var(--paper)" stroke-width="3" paint-order="stroke">${esc(s.name.length>14?s.name.slice(0,13)+'…':s.name)}</text>`:''}</g>`});
 if(pendingPin){const x=X(pendingPin[0]),y=Y(pendingPin[1]);g+=`<circle cx="${x}" cy="${y}" r="9" fill="none" stroke="${c}" stroke-width="3"/>`}
 // 축척
 const kmPx=0.0105*sc;g+=`<line x1="14" y1="${H-16}" x2="${14+kmPx}" y2="${H-16}" stroke="var(--ink)" stroke-width="2"/><text x="14" y="${H-22}" font-size="12" fill="var(--mute)">1km</text>`;
 svg.innerHTML=g}

/* ---------- 지도 조작 ---------- */
let drag=null;
function bindMap(){const fig=$('#fig');if(!fig||fig._b)return;fig._b=1;
 fig.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,cx:view.cx,cy:view.cy,moved:false};fig.setPointerCapture(e.pointerId)});
 fig.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;if(!drag.moved)return;view.cx=drag.cx-dx/proj.sc;view.cy=drag.cy+dy/(proj.sc/Math.cos(rad(31.2)));drawMap(S.days[cur],plan(S.days[cur]))});
 fig.addEventListener('pointerup',e=>{if(drag&&!drag.moved&&pinFor){const b=fig.getBoundingClientRect();const[lng,lat]=proj.inv(e.clientX-b.left,e.clientY-b.top);setPin(pinFor,lng,lat)}drag=null});
 fig.addEventListener('wheel',e=>{e.preventDefault();view.span*=e.deltaY>0?1.15:0.87;drawMap(S.days[cur],plan(S.days[cur]))},{passive:false})}

function findStop(key){const d=S.days[cur];if(key==='start')return d.start;if(key==='end')return d.end;return d.stops.find(s=>s.id===key)}
function setPin(key,lng,lat){if(key==='__new'){pendingPin=[+lng.toFixed(5),+lat.toFixed(5)];pinFor=null;render();openEdit('__new');return}
 const s=findStop(key);if(!s)return;snap();s.lng=+lng.toFixed(5);s.lat=+lat.toFixed(5);pinFor=null;save();render();toast(`「${s.name}」 위치를 찍었어요`)}

/* ---------- 편집 시트 ---------- */
let draft=null;
function openEdit(key){const d=S.days[cur];const isNew=key==='__new';const s=isNew?(draft||{id:uid(),name:'',zh:'',stay:60}):findStop(key);if(!s)return;
 if(isNew&&pendingPin){s.lng=pendingPin[0];s.lat=pendingPin[1];pendingPin=null}draft=isNew?s:null;
 const isA=key==='start'||key==='end';
 $('#sheet').innerHTML=`<h2>${isNew?'장소 추가':'편집'} · ${esc(d.label)}</h2>
 ${isNew?`<label for="f-pre">추천 목록에서 고르기</label><select id="f-pre"><option value="">직접 입력</option><optgroup label="맛집 · 디저트 (추천 메뉴·가격 포함)">${FOOD.map((p,i)=>`<option value="f${i}">${esc(p.name)}</option>`).join('')}</optgroup><optgroup label="명소">${PRESETS.map((p,i)=>`<option value="${i}">${esc(p[0])} ${esc(p[1])}</option>`).join('')}</optgroup></select>`:''}
 ${key!=='start'&&key!=='end'?`<label for="f-type">종류</label><select id="f-type"><option value="">장소 · 체험</option><option value="food" ${s.type==='food'?'selected':''}>식당</option><option value="cafe" ${s.type==='cafe'?'selected':''}>카페 · 디저트</option><option value="shop" ${s.type==='shop'?'selected':''}>쇼핑</option></select>
 <div id="f-foodbox" ${s.type==='food'||s.type==='cafe'?'':'hidden'}><label for="f-menu">추천 메뉴</label><input id="f-menu" value="${esc(s.menu||'')}" placeholder="예: 게살 샤오롱바오"><label for="f-price">가격대</label><input id="f-price" value="${esc(s.price||'')}" placeholder="예: 1인 ¥50~80"><p class="sub" style="font-size:13px;margin-top:6px">모르는 식당이면 비워두고 Claude에게 「○○ 추천 메뉴랑 가격 채워줘」라고 물어보세요.</p></div>`:''}
 <label for="f-name">이름</label><input id="f-name" value="${esc(s.name)}" placeholder="예: 우캉맨션">
 <label for="f-zh">중국어 이름·주소 (택시 기사님께 보여줄 글)</label><input id="f-zh" value="${esc(s.zh||'')}" placeholder="例: 武康大楼">
 <label for="f-ll">좌표 (경도,위도 — 고덕지도 기준)</label><input id="f-ll" inputmode="decimal" value="${s.lng!=null?esc(s.lng+','+s.lat):''}" placeholder="121.4375,31.2045 — 비워두면 위치 미지정">
 <div class="acts"><button data-act="pickmap">지도에서 핀 찍기</button>${s.zh||s.name?`<a class="amap" href="${esc(`https://uri.amap.com/search?keyword=${enc(s.zh||s.name)}&city=310000&callnative=1`)}">고덕에서 검색해보기</a>`:''}</div>
 <div class="row2">${key==='start'?`<div><label for="f-time">출발 시각</label><input id="f-time" type="time" value="${esc(s.time||'')}"></div>`:''}
 ${key!=='end'?`<div><label for="f-stay">머무는 시간(분)</label><input id="f-stay" type="number" min="0" step="5" value="${esc(s.stay??60)}"></div>`:''}
 ${!isA?`<div><label for="f-want">희망 시작 시각 (선택)</label><input id="f-want" type="time" value="${esc(s.want||'')}"></div>`:''}
 ${key==='end'?`<div><label for="f-dl">도착 마감 시각 (선택)</label><input id="f-dl" type="time" value="${esc(s.deadline||'')}"></div>`:''}</div>
 ${!isA?`<label style="display:flex;gap:8px;align-items:center"><input id="f-lock" type="checkbox" style="width:22px;height:22px" ${s.lock?'checked':''}> 최적화할 때 이 순서 고정</label>`:''}
 ${!isA&&!isNew?'':''}<label for="f-note">메모</label><textarea id="f-note" rows="3">${esc(s.note||'')}</textarea>
 ${!isNew&&!isA?`<label for="f-day">다른 날로 옮기기</label><select id="f-day">${S.days.map((dd,i)=>`<option value="${i}" ${i===cur?'selected':''}>${esc(dd.label)}</option>`).join('')}</select>`:''}
 <div class="bar" style="margin-top:16px"><button class="btn pri" data-act="savestop" data-key="${esc(key)}">저장</button><button class="btn" data-act="close">취소</button>${!isNew&&!isA?`<button class="btn" data-act="del" data-key="${esc(key)}" style="margin-left:auto">삭제</button>`:''}</div>`;
 $('#modal').classList.add('on');$('#modal')._key=key;
 const ft=$('#f-type');if(ft)ft.onchange=()=>{$('#f-foodbox').hidden=!(ft.value==='food'||ft.value==='cafe')};
 const pre=$('#f-pre');if(pre)pre.onchange=()=>{const v=pre.value;if(!v)return;
  if(v[0]==='f'){const f=FOOD[+v.slice(1)];$('#f-name').value=f.name;$('#f-zh').value=f.zh;$('#f-ll').value=f.lng!=null?f.lng+','+f.lat:'';ft.value=f.type;$('#f-foodbox').hidden=false;$('#f-menu').value=f.menu;$('#f-price').value=f.price;$('#f-note').value=f.note;$('#f-stay').value=f.type==='cafe'?20:60;return}
  const p=PRESETS[v];$('#f-name').value=p[0];$('#f-zh').value=p[1];$('#f-ll').value=p[2]+','+p[3]};
 setTimeout(()=>$('#f-name')?.focus(),50)}
function readForm(s){if($('#f-type')){s.type=$('#f-type').value;s.menu=$('#f-menu').value.trim();s.price=$('#f-price').value.trim()}s.name=$('#f-name').value.trim()||'이름 없는 장소';s.zh=$('#f-zh').value.trim();
 const ll=$('#f-ll').value.split(/[,\s]+/).map(Number).filter(n=>!isNaN(n)&&n!==0);
 if(ll.length===2){let[a,b]=ll;if(a<b)[a,b]=[b,a];s.lng=a;s.lat=b}else{s.lng=null;s.lat=null}
 const v=id=>$(id)?.value;if($('#f-time'))s.time=v('#f-time');if($('#f-stay'))s.stay=Math.max(0,+v('#f-stay')||0);if($('#f-want'))s.want=v('#f-want')||'';if($('#f-dl'))s.deadline=v('#f-dl')||'';if($('#f-lock'))s.lock=$('#f-lock').checked;s.note=v('#f-note')}
function closeSheet(){$('#modal').classList.remove('on')}

function openMore(){$('#sheet').innerHTML=`<h2>백업 · 설정</h2>
 <p class="sub">편집 내용은 이 기기에 자동 저장돼요. 친구 폰으로 옮기려면 아래 코드를 복사해서 카톡으로 보내고, 친구가 「붙여넣기」에 넣으면 돼요.</p>
 <div class="bar" style="margin-top:12px"><button class="btn pri" data-act="copycode">백업 코드 복사</button></div>
 <label for="f-code">백업 코드 붙여넣기</label><textarea id="f-code" rows="4" placeholder="여기에 붙여넣기"></textarea>
 <div class="bar" style="margin-top:10px"><button class="btn" data-act="import">불러오기</button><button class="btn" data-act="reset" style="margin-left:auto">처음 일정으로 초기화</button><button class="btn" data-act="close">닫기</button></div>`;$('#modal').classList.add('on')}

/* ---------- 저장 · 공유 ---------- */
function snap(){undoStack.push(JSON.stringify(S));if(undoStack.length>30)undoStack.shift()}
let dirty=false,pubT=null,readOnly=false;
function save(){S.saved=Date.now();try{localStorage.setItem('sh-trip',JSON.stringify(S))}catch(e){}
 if(artifactApi&&!readOnly){dirty=true;clearTimeout(pubT);pubT=setTimeout(shareSave,2500)}syncLabel()}
const changed=save;
function syncLabel(){const t=artifactApi&&!readOnly?(dirty?'친구 화면에 반영 중…':'✓ 친구와 같은 화면으로 동기화돼요'):readOnly?'보기 전용 — 이 기기에만 저장돼요':'이 기기에 자동 저장 · 친구에겐 「백업」 코드로';document.querySelectorAll('.sync').forEach(e=>e.textContent=t)}
let artifactApi=null;
try{window.claude?.use?.('artifact')?.then(a=>{artifactApi=a;syncLabel()}).catch(()=>{})}catch(e){}
async function shareSave(){if(!artifactApi)return;S.saved=Date.now();const json=JSON.stringify(S).replace(/</g,'\\u003c');
 const html=`<!DOCTYPE html>\n<html lang="ko">\n<head>${document.head.innerHTML}</head>\n<body>\n<div id="app"></div>\n<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>\n<div class="toast" id="toast"></div>\n<script id="state" type="application/json">${json}<\/script>\n<script id="app-js">${$('#app-js').textContent}<\/script>\n</body>\n</html>`;
 try{sessionStorage.setItem('sh-cur',cur)}catch(e){}try{await artifactApi.publish(html);dirty=false;syncLabel()}catch(e){const m=String(e?.code||e?.message||e);if(/not_granted|not_writer/.test(m)){readOnly=true;dirty=false;syncLabel()}else{dirty=false;toast('친구가 동시에 고쳐서 친구 쪽 내용으로 맞췄어요')}}}

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
async function copy(txt,msg){try{await navigator.clipboard.writeText(txt);toast(msg||'복사했어요')}catch(e){toast('복사가 막혔어요 — 길게 눌러 직접 복사해주세요')}}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-tab]');if(!t)return;const day=S.days[cur];const st=day.stops;
 if(t.dataset.ck){const c=S.checks.find(x=>x.id===t.dataset.ck);if(c){c[t.dataset.who]=!c[t.dataset.who];changed();renderCheck()}return}
 if(t.dataset.addspot!=null){addSpot(+t.dataset.addspot,+t.dataset.day);return}
 if(t.dataset.sf){spotFilter=t.dataset.sf;spotFocus=null;renderPhoto();return}
 if(t.dataset.addfood!=null){addFood(+t.dataset.addfood,+t.dataset.day);return}
 if(t.dataset.dl){const x=S.deliv.find(y=>y.id===t.dataset.dl);if(x){x[t.dataset.who]=!x[t.dataset.who];changed();renderDeliv()}return}
 if(t.dataset.deldel){S.deliv=S.deliv.filter(y=>y.id!==t.dataset.deldel);changed();renderDeliv();return}
 if(t.dataset.gift){const g=S.gifts.find(x=>x.id===t.dataset.gift);if(g){g[t.dataset.who]=!g[t.dataset.who];changed();renderGift()}return}
 if(t.dataset.delgift){S.gifts=S.gifts.filter(x=>x.id!==t.dataset.delgift);changed();renderGift();return}
 if(t.dataset.delck){S.checks=S.checks.filter(x=>x.id!==t.dataset.delck);changed();renderCheck();return}
 if(t.dataset.tab!=null){cur=+t.dataset.tab;try{sessionStorage.setItem('sh-cur',cur)}catch(e){}view=null;pinFor=null;render();return}
 if(t.dataset.z!=null){const z=+t.dataset.z;if(z===0)view=null;else view.span/=z;drawMap(day,plan(day));return}
 if(t.dataset.copy){copy(t.dataset.copy,'중국어를 복사했어요 — 택시 기사님께 보여주세요');return}
 if(t.dataset.edit){openEdit(t.dataset.edit);return}
 if(t.dataset.pin){pinFor=t.dataset.pin;render();$('#fig').scrollIntoView({behavior:'smooth',block:'center'});return}
 if(t.dataset.up||t.dataset.down){const id=t.dataset.up||t.dataset.down,i=st.findIndex(s=>s.id===id),j=i+(t.dataset.up?-1:1);if(j<0||j>=st.length)return;snap();[st[i],st[j]]=[st[j],st[i]];save();render();return}
 const a=t.dataset.act;if(!a)return;
 if(a==='opt')optimize();
 else if(a==='add'){draft=null;openEdit('__new')}
 else if(a==='undo'){const p=undoStack.pop();if(p){S=JSON.parse(p);save();renderAll();toast('되돌렸어요')}}
 else if(a==='share')shareSave();
 else if(a==='more')openMore();
 else if(a==='close'){closeSheet();draft=null}
 else if(a==='pincancel'){pinFor=null;render();bindMap()}
 else if(a==='pickmap'){const k=$('#modal')._key;if(k==='__new'&&draft)readForm(draft);closeSheet();pinFor=k;render();toast('지도를 탭하세요');}
 else if(a==='savestop'){const k=t.dataset.key;snap();if(k==='__new'){const s=draft||{id:uid()};readForm(s);s.id=s.id||uid();const ti=st.findIndex(x=>x.tail);if(ti<0)st.push(s);else st.splice(ti,0,s);draft=null}else{const s=findStop(k);readForm(s);const nd=$('#f-day');if(nd&&+nd.value!==cur){day.stops=st.filter(x=>x!==s);S.days[+nd.value].stops.push(s)}}
  save();closeSheet();render();bindMap()}
 else if(a==='del'){snap();day.stops=st.filter(s=>s.id!==t.dataset.key);save();closeSheet();render();toast('삭제했어요 — 되돌리기 가능')}
 else if(a==='copycode')copy(btoa(unescape(encodeURIComponent(JSON.stringify(S)))),'백업 코드를 복사했어요');
 else if(a==='import'){try{const o=JSON.parse(decodeURIComponent(escape(atob($('#f-code').value.trim()))));if(!o.days)throw 0;snap();S=o;save();closeSheet();renderAll();toast('불러왔어요')}catch(err){toast('코드가 올바르지 않아요')}}
 else if(a==='reset'){snap();S=JSON.parse(JSON.stringify(DEFAULT));if(!S.checks)S.checks=seedChecks();S.gifts=seedGifts();S.deliv=seedDeliv();save();closeSheet();view=null;renderAll();toast('초기화했어요 — 되돌리기 가능')}
});
document.addEventListener('click',e=>{const g=e.target.closest('[data-spin]');if(!g)return;spotFocus=+g.dataset.spin;renderPhoto();const c=document.getElementById('spot-'+spotFocus);if(c)c.scrollIntoView({behavior:'smooth',block:'center'})});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){closeSheet();draft=null}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
const ro=new ResizeObserver(()=>{if($('#smap'))drawSpots(SPOTS.map((p,i)=>({...p,i})).filter(p=>spotFilter==='all'||p.k===spotFilter));if($('#fig'))drawMap(S.days[cur],plan(S.days[cur]))});
shell();renderAll();ro.observe(document.body);
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
</script>
</body>
